{% set name = "yfinance" %}
{% set version = "0.2.65" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b22b18f9734337b4ce26e9dec093698007266c6c18f9586939b53e115e4335d2

build:
  number: 0
  entry_points:
    - sample = sample:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - pandas >=1.3.0
    - numpy >=1.16.5
    - requests >=2.31
    - multitasking >=0.0.7
    - platformdirs >=2.0.0
    - pytz >=2022.5
    - frozendict >=2.3.4
    - peewee >=3.16.2
    - beautifulsoup4 >=4.11.1
    - curl_cffi >=0.7
    - protobuf >=3.19.0
    - websockets >=13.0
  run_constrained:
    - requests_cache >=1.0
    - requests_ratelimiter >=0.3.1
    - scipy >=1.6.3

test:
  source_files:
    - tests
  imports:
    - yfinance
    - yfinance.const
    - yfinance.data
    - yfinance.exceptions
    - yfinance.live
    - yfinance.pricing_pb2
    - yfinance.scrapers.quote
    - yfinance.screener.query
    - yfinance.screener.screener
    - yfinance.utils
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://ranaroussi.github.io/yfinance
  summary: yfinance offers a Pythonic way to fetch financial & market data from Yahoo! finance.
  description: yfinance offers a Pythonic way to fetch financial & market data from Yahoo! finance.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  dev_url: https://github.com/ranaroussi/yfinance
  doc_url: https://ranaroussi.github.io/yfinance

extra:
  recipe-maintainers:
    - jan-janssen
